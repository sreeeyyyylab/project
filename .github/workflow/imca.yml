name: Continuous Integration

# Triggers the workflow on push or pull request events for the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # Specifies the type of runner the job will run on
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository code so the workflow can access it
      - name: Check out repository code
        uses: actions/checkout@v4
      # Step 2: Set up your environment (Example: Node.js)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'
          cache: 'npm' # Caches dependencies for faster subsequent runs
      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run your linter/code formatter (Optional)
      - name: Run linter
        run: npm run lint

      # Step 5: Run your automated test suite
      - name: Run tests
        run: npm test
